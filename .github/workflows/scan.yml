name: Run parabolic scan

on:
  schedule:
    # 9:40am US/Eastern, weekdays. GitHub cron is UTC and does not shift for
    # daylight saving, so both offsets are listed — one is a no-op depending
    # on the time of year (EDT = UTC-4, EST = UTC-5).
    - cron: "40 13 * * 1-5"  # 9:40am EDT (roughly Mar-Nov)
    - cron: "40 14 * * 1-5"  # 9:40am EST (roughly Nov-Mar)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        run: python3 scan.py

      - name: Commit updated data
        run: |
          git config user.name "parabolic-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json
          git diff --staged --quiet || git commit -m "chore: refresh scan data"
          git push
