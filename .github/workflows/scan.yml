name: Run parabolic scan

on:
  schedule:
    # Every 15 minutes, 8am-6pm US/Eastern, weekdays — covers premarket
    # through after-hours across both EDT and EST (GitHub cron is UTC and
    # doesn't shift for daylight saving, so the window is padded an hour on
    # each side rather than kept exact). GitHub doesn't reliably support
    # 5-minute schedules, so this is the backup net — run scan.yml manually
    # (gh workflow run scan.yml) for instant on-demand refreshes.
    - cron: "*/15 12-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        run: python3 scan.py

      - name: Commit updated data
        run: |
          git config user.name "parabolic-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/history.jsonl
          git diff --staged --quiet || git commit -m "chore: refresh scan data"
          for i in 1 2 3 4 5; do
            git push && break
            echo "push rejected, retrying after rebase ($i/5)..."
            git pull --rebase origin main
            sleep 3
          done
