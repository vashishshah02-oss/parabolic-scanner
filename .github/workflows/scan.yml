name: Run parabolic scan

on:
  schedule:
    # Every 5 minutes, 8am-6pm US/Eastern, weekdays — covers premarket
    # through after-hours across both EDT and EST (GitHub cron is UTC and
    # doesn't shift for daylight saving, so the window is padded an hour on
    # each side rather than kept exact).
    - cron: "*/5 12-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        run: python3 scan.py

      - name: Commit updated data
        run: |
          git config user.name "parabolic-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json
          git diff --staged --quiet || git commit -m "chore: refresh scan data"
          git push
