name: Run backtest

on:
  schedule:
    # Once a day after the close, 4:30pm US/Eastern, weekdays. Both UTC
    # offsets are listed for EDT/EST — one is a no-op depending on season.
    - cron: "30 20 * * 1-5"  # 4:30pm EDT
    - cron: "30 21 * * 1-5"  # 4:30pm EST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest
        run: python3 backtest.py

      - name: Commit updated backtest results
        run: |
          git config user.name "parabolic-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtest.json
          git diff --staged --quiet || git commit -m "chore: refresh backtest results"
          for i in 1 2 3 4 5; do
            git push && break
            echo "push rejected, retrying after rebase ($i/5)..."
            git pull --rebase origin main
            sleep 3
          done
